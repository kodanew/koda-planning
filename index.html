<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>한국디벨로퍼협회(KODA) 일정 안내</title>
<!-- 카카오톡 등 SNS 공유 시 표시되는 정보 (Open Graph) -->
<meta content="website" property="og:type"/>
<meta content="KODA SCHEDULE APP" property="og:title"/>
<meta content="한국디벨로퍼협회(KODA) 일정 안내" property="og:description"/>
<meta content="https://kodanew.github.io/koda-planning/" property="og:url"/>
<meta content="https://kodanew.github.io/koda-planning/share-image.png" property="og:image"/>
<meta content="866" property="og:image:width"/>
<meta content="283" property="og:image:height"/>
<!-- 모바일 홈 화면(PWA) 및 iOS 앱 설정 -->
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="default" name="apple-mobile-web-app-status-bar-style"/>
<meta content="KODA 일정" name="apple-mobile-web-app-title"/>
<link href="로고.png" rel="apple-touch-icon"/>
<link href="manifest.json" rel="manifest"/>
<!-- 카카오톡 인앱 브라우저 강제 탈출 스크립트 -->
<script>
  var userAgent = navigator.userAgent.toLowerCase();
  if(userAgent.indexOf('kakaotalk') > -1){
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
  }
</script>
<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --primary-color: #0052cc; 
    --accent-color: #c5a977; 
    --bg-color: #f4f6f9;
    --card-bg: #ffffff;
    --text-dark: #1a202c;
    --text-muted: #718096;
    --border-color: #e2e8f0;
    --today-color: #e53e3e; 
  }

  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background-color: var(--bg-color);
    margin: 0;
    padding: 0;
    color: var(--text-dark);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
    user-select: none; 
    -webkit-user-select: none;
    width: 100%;
    overflow-x: hidden;
  }

  .app-container {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    background: var(--bg-color);
  }

  /* 헤더 영역 */
  .header {
    background-color: transparent;
    padding: 10px 12px;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    width: 100%;
  }
  .header img {
    height: 26px; 
    width: auto;
    max-width: 55%;
    object-fit: contain;
  }
  
  .refresh-btn {
    position: absolute;
    left: 20px;
    top: 15px;
    background-color: transparent;
    color: #718096;
    border: 1px solid #e2e8f0;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }
  .refresh-btn:active {
    color: #1a202c;
  }

  .header-right {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 6px;
  }
.notify-btn:active {
    color: #718096;
  }
.install-btn {
    top: 25px;
    background-color: transparent;
    color: #718096;
    border: 1px solid #e2e8f0;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 600;
    cursor: pointer;
  }

  .logout-btn {
    top: 25px;
    background-color: transparent;
    color: #718096;
    border: 1px solid #e2e8f0;
    padding: 3px 6px;
    border-radius: 6px;
    font-size: 0.6rem;
    font-weight: 600;
    cursor: pointer;
  }
  .logout-btn:active {
    color: #1a202c;
  }

  /* 오늘 날짜 · 날씨 */
  .today-weather-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:calc(100% - 20px);
    margin:0 10px 4px;
    padding:2px 3px 0;
  }
  .today-date-info{display:flex;align-items:baseline;gap:7px;min-width:0;}
  .today-date{font-size:1.05rem;font-weight:800;color:#123b70;letter-spacing:-.03em;white-space:nowrap;}
  .today-weekday{font-size:.84rem;font-weight:700;color:#4f6f95;white-space:nowrap;}
  .today-weather{display:flex;align-items:center;gap:6px;color:#4f6f95;font-size:.78rem;font-weight:700;white-space:nowrap;}
  .today-weather-icon{font-size:1.05rem;line-height:1;}
  .today-weather-temp{color:#123b70;font-weight:800;}
  @media(max-width:360px){.today-weather-bar{gap:7px}.today-date{font-size:.98rem}.today-weekday,.today-weather{font-size:.72rem}}

  /* 달력 영역 */
  .calendar-wrapper {
    background: var(--card-bg);
    margin: 10px;
    border-radius: 12px;
    padding: 10px;
    border: 1.5px solid #2b73d2;
    box-shadow: 0 5px 18px rgba(0,82,204,0.08);
    overflow: hidden; 
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: 700;
    font-size: 1rem;
  }
  .cal-nav-btn {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eef5ff;
    border: 1px solid #c9ddfb;
    border-radius: 9px;
    font-size: 1.15rem;
    line-height: 1;
    font-weight: 800;
    color: #0756c9;
    cursor: pointer;
    padding: 0;
    box-shadow: 0 3px 8px rgba(0,82,204,.10);
  }
  .cal-nav-btn:active { transform: scale(.95); background:#dcecff; }
  
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
    animation: fadeIn 0.3s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0.3; transform: translateX(5px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .cal-day-name {
    font-size: 0.65rem;
    color: var(--text-muted);
    padding-bottom: 3px;
    font-weight: 600;
  }
  .cal-cell {
    min-height: 48px;
    border-radius: 4px;
    background: #fdfdfd;
    border: 1px solid #f0f0f0;
    display: flex;
    flex-direction: column;
    padding: 2px;
    text-align: left;
    position: relative;
    overflow: hidden;
  }
  .cal-cell.empty { background: transparent; border: none; }
  
  /* 오늘 표시: 셀 배경/테두리는 그대로 두고 날짜 숫자만 검은 원으로 표시 */
  .cal-cell.today {
    background: #fdfdfd;
    border: 1px solid #f0f0f0;
  }
  .today-circle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    min-width: 17px;
    height: 17px;
    padding: 0 2px;
    margin: -1px 0 -1px -2px;
    border-radius: 999px;
    background: #111111;
    color: #ffffff !important;
    font-size: 0.65rem;
    font-weight: 800;
    line-height: 1;
  }
  
  .cal-date-num {
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--text-dark);
    margin-bottom: 2px;
    padding-left: 1px;
    display: flex;
    align-items: center;
  }
  
  .text-red { color: #e53e3e !important; }
  .text-blue { color: #3182ce !important; }

  
  .cal-event-chip {
    font-size: 0.55rem;
    padding: 2px 2px;
    border-radius: 3px;
    margin-bottom: 2px;
    color: #000000;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background-color: #ffffff;
    border: 1px solid #e5e7eb;
    font-weight: 600;
    cursor: pointer;
  }
  .cal-event-chip.chairman {
    background-color: #d0e1fd;
    border: 1px solid #d0e1fd;
    color: #000000;
  }

  /* ✨ 모던 일정 배너 ✨ */
  .schedule-banner {
    margin-top:0!important;
    position: relative;
    width: calc(100% - 20px);
    margin: 0 10px 10px;
    min-height: 112px;
    border-radius: 20px;
    overflow: hidden;
    color: #fff;
    background:
      radial-gradient(circle at 92% 15%, rgba(110,190,255,.28) 0, rgba(110,190,255,0) 34%),
      radial-gradient(circle at 10% 100%, rgba(38,111,255,.30) 0, rgba(38,111,255,0) 35%),
      linear-gradient(135deg, #073b8f 0%, #0756c9 52%, #0878d9 100%);
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 10px 26px rgba(0,61,145,.20);
    touch-action: pan-y;
  }
  .schedule-banner::before,
  .schedule-banner::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,.10);
  }
  .schedule-banner::before { width: 110px; height: 110px; right: -35px; top: -55px; }
  .schedule-banner::after { width: 72px; height: 72px; left: -34px; bottom: -42px; }
  .schedule-banner-track { position: relative; min-height: 112px; z-index: 1; }
  .schedule-banner-slide {
    display: none;
    min-height: 112px;
    padding: 15px 18px 25px;
    box-sizing: border-box;
    animation: bannerFade .28s ease;
  }
  .schedule-banner-slide.active { display: flex; flex-direction: column; justify-content: center; }
  @keyframes bannerFade {
    from { opacity: 0; transform: translateX(10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .banner-heading {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 4px;
  }
  .banner-kicker {
    display: inline-flex;
    align-items: center;
    min-height: 20px;
    padding: 0 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.18);
    color: rgba(255,255,255,.92);
    font-size: .60rem;
    font-weight: 800;
    letter-spacing: -.01em;
  }
  .banner-title { display:none; }
  .banner-list { display:flex; flex-direction:column; gap:0; width:100%; }
  .banner-event {
    width:100%;
    padding:0;
    border:0;
    background:transparent;
    color:#fff;
    text-align:left;
    cursor:pointer;
  }
  .banner-event-line1 {
    display:block;
    width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:rgba(255,255,255,.84);
    font-size:.80rem;
    line-height:1.35;
    font-weight:650;
    letter-spacing:-.025em;
  }
  .banner-event-line2 {
    display:block;
    width:100%;
    margin-top:3px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    color:#fff;
    font-size:1.08rem;
    line-height:1.35;
    font-weight:800;
    letter-spacing:-.035em;
  }
  .banner-empty { padding:18px 8px; font-size:.78rem; color:rgba(255,255,255,.78); text-align:center; }
  .banner-nav { display:none !important; }
  .banner-dots {
    position:absolute;
    right:42px;
    bottom:9px;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:5px;
    z-index:3;
  }
  .banner-dot {
    width:6px;
    height:6px;
    padding:0;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.42);
    cursor:pointer;
  }
  .banner-dot.active { width:7px; height:7px; background:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.16); }
  .banner-pause-btn {
    position:absolute;
    right:11px;
    bottom:6px;
    width:24px;
    height:24px;
    padding:0;
    border:1px solid rgba(255,255,255,.28);
    border-radius:8px;
    background:rgba(255,255,255,.13);
    color:#fff;
    font-size:.65rem;
    line-height:22px;
    font-weight:900;
    z-index:4;
    cursor:pointer;
    backdrop-filter:blur(6px);
  }
  .banner-pause-btn.paused { background:#fff; color:#0756c9; }

  /* 상단 메뉴바 */
  .quick-menu-container,
  .sub-menu-container {
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
    padding:0 8px 9px;
    width:100%;
    box-sizing:border-box;
    align-items:start;
  }
  .quick-btn {
    min-height:78px;
    padding:0;
    background:transparent !important;
    border:0;
    color:var(--text-dark);
    text-align:center;
    text-decoration:none;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    box-shadow:none;
    word-break:keep-all;
    cursor:pointer;
    box-sizing:border-box;
  }
  .quick-icon {
    width:50px;
    height:50px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
    border:1px solid #e6edf7;
    box-shadow:0 5px 14px rgba(22,52,95,.08);
    overflow:hidden;
    transition:transform .15s, box-shadow .15s;
  }
  .quick-icon img { width:72%; height:72%; object-fit:contain; display:block; }
  .quick-icon svg { width:31px; height:31px; display:block; }
  .quick-btn:hover .quick-icon { transform:translateY(-2px); box-shadow:0 8px 18px rgba(22,52,95,.12); }
  .quick-label {
    margin-top:6px;
    font-size:.66rem;
    font-weight:750;
    line-height:1.15;
    white-space:normal;
  }
  .sub-menu-container { padding-top:1px; padding-bottom:10px; }
  .sub-menu-container .quick-btn { min-height:78px; }

  /* 일정 리스트 영역 */
  .schedule-container {
    padding: 0 10px 30px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }

  .schedule-section-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: baseline;
    padding: 5px 5px 10px 5px;
    margin-top: 5px;
    margin-bottom: 0px;
    width: 100%;
    row-gap: 4px;
  }
  
  .schedule-title-wrapper {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: clamp(4px, 2vw, 8px);
    margin-left: clamp(4px, 3vw, 12px);
    min-width: 0;
  }

  .schedule-section-title {
    font-size: clamp(0.95rem, 4.2vw, 1.15rem);
    font-weight: 800;
    color: var(--text-dark);
    white-space: nowrap;
  }

  .schedule-section-subtitle {
    font-size: clamp(0.68rem, 3vw, 0.85rem); 
    color: #a0aec0; 
    font-weight: 500;
  }

  .past-schedule-btn {
    background: none;
    border: none;
    font-size: clamp(0.62rem, 2.8vw, 0.75rem);
    color: var(--text-muted);
    text-decoration: none; 
    cursor: pointer;
    padding: 0 2px 2px 0;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .past-schedule-btn:hover {
    color: var(--text-dark);
  }

  .schedule-list-wrapper {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
  }
  #pastScheduleList {
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 1px dashed var(--border-color);
  }

  /* 이벤트 카드 */
  .event-card {
    background: var(--card-bg);
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    border: 1px solid rgba(0,0,0,0.04);
    overflow: hidden;
    position: relative;
  }

  .event-card.today-card {
    border: 2.5px solid #e53e3e;
  }

  .event-header {
    display: flex;
    flex-direction: column;
    padding: 12px 70px 12px 15px; 
    cursor: pointer;
    background: transparent;
    border: none;
    width: 100%;
    text-align: left;
  }

  .card-actions {
    position: absolute;
    top: 10px;
    right: 8px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: #cbd5e0;
    width: 28px;
    height: 28px;
    padding: 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn svg {
    width: 18px;
    height: 18px;
    display: block;
  }

  .share-btn:active {
      color: #718096;
  }

  .star-btn.starred {
    color: #d69e2e;
  }

  .event-meta {
    display: flex;
    justify-content: flex-start;
    align-items: center;
    gap: 5px; 
    width: 100%;
    margin-bottom: 5px;
    flex-wrap: wrap;
  }

  .event-date {
    font-size: 0.9rem;
    font-weight: 800;
    color: #000000;
  }
  
  .event-divider {
    font-size: 0.85rem;
    color: #cbd5e0;
    font-weight: 700;
  }

  .event-location {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
    text-align: left;
  }

  .event-title {
    font-size: 1rem; 
    font-weight: 600;
    color: var(--text-dark);
    line-height: 1.35;
    word-break: keep-all;
    margin-top: 2px;
  }
  
  .event-title.chairman {
    color: var(--primary-color);
    font-weight: 800;
  }

  /* 팝업(모달) 스타일 */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 12px;
    box-sizing: border-box;
  }

  .modal-content {
    background: #ffffff;
    width: 100%;
    max-width: 400px;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position: relative;
    animation: slideUp 0.3s ease-out;
    max-height: 90vh;
    overflow-y: auto;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-close {
    position: absolute;
    top: 10px;
    right: 10px;
    background: none;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    color: #a0aec0;
    z-index: 10;
  }
  
  .day-events-modal-content { max-width: 400px; }
  .day-events-title { font-size: 1.05rem; font-weight: 800; margin-bottom: 4px; }
  .day-events-subtitle { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 12px; }
  .day-event-list { display: flex; flex-direction: column; gap: 7px; }
  
  /* 리스트 공통(일정, 자료, 직원) 버튼 아이템 */
  .day-event-item {
    width: 100%; text-align: left; background: #ffffff;
    border: 1px solid #e5e7eb; border-radius: 9px;
    padding: 10px 11px; cursor: pointer;
  }
  .day-event-item:active { background: #f8fafc; }
  .day-event-item-title { font-size: 0.82rem; font-weight: 700; line-height: 1.35; word-break: keep-all; }
  .day-event-item-title .chairman-mark {
    font-size: 0.58rem;
    vertical-align: super;
    line-height: 0;
    margin-left: 2px;
    color: #c08a22;
    font-weight: 800;
  }
  .day-event-item-meta { margin-top: 4px; font-size: 0.68rem; color: var(--text-muted); line-height: 1.3; }
  .day-event-item.chairman { border-color: #d0e1fd; background: #f5f9ff; }

  /* 직원 목록용 뱃지 스타일 */
  .staff-badge {
    display: inline-block;
    background: #e2e8f0;
    color: #4a5568;
    font-size: 0.6rem;
    padding: 2px 6px;
    border-radius: 4px;
    margin-right: 6px;
    font-weight: 700;
    vertical-align: middle;
  }
  .staff-badge.executive {
    background: #ebf8ff;
    color: #3182ce;
  }

  /* 협회공지 목록/상세용 뱃지 (임직원현황 뱃지와 동일한 디자인 언어) */
  .news-badge {
    display: inline-block;
    vertical-align: middle;
    font-size: 0.62rem;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: 999px;
    margin-right: 6px;
    background: #edf2f7;
    color: #4a5568;
  }
  .news-badge-sale { background: #ebf8ff; color: #3182ce; }
  .news-badge-wedding { background: #fff5f7; color: #d53f8c; }
  .news-badge-obituary { background: #edf1f5; color: #4a5568; }
  .news-badge-etc { background: #f7fafc; color: #718096; }

  .day-event-item.news-card-item {
    display:flex;
    flex-direction:row;
    align-items:center;

  grid-row:1 !important;
  justify-self:start !important;
  display:flex !important;
  align-items:center !important;
  min-width:0 !important;
  z-index:4 !important;
}
.app-container > .header .header-right{
  grid-column:3 !important;
  grid-row:1 !important;
  position:static !important;
  transform:none !important;
  justify-self:end !important;
  display:flex !important;
  align-items:center !important;
  gap:5px !important;
  z-index:4 !important;
}
.my-business-card-btn{
  appearance:none;
  border:1px solid #d9e5f3;
  background:#f8fbff;
  color:#1769d2;
  border-radius:7px;
  padding:5px 8px;
  min-height:0 !important;
  height:auto !important;
  line-height:1.2;
  font-size:.67rem;
  font-weight:800;
  letter-spacing:-.04em;
  white-space:nowrap;
  cursor:pointer;
  box-shadow:0 2px 7px rgba(23,105,210,.07);
}
.my-business-card-btn:active{transform:scale(.97);background:#edf5ff;}
.business-card-overlay{
  display:none; position:fixed; inset:0; z-index:2600;
  background:rgba(8,25,48,.68);
  padding:18px; box-sizing:border-box;
  align-items:center; justify-content:center;
}
.business-card-modal{
  position:relative; width:min(100%,430px); max-height:94vh; overflow:auto;
  background:#f4f7fb; border-radius:18px; padding:18px 14px 15px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
}
.business-card-close{
  position:absolute; top:7px; right:8px; z-index:5; width:34px; height:34px;
  border:0; border-radius:50%; background:rgba(255,255,255,.9); color:#60738c;
  font-size:1.45rem; line-height:1; cursor:pointer;
}
.business-card-modal-title{
  text-align:center; color:#173f70; font-size:1rem; font-weight:850;
  margin:1px 38px 12px; letter-spacing:-.04em;
}
